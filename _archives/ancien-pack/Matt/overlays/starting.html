<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Matt Racing Live — Starting Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue:   #0A1EFF;
  --blue-g: rgba(10,30,255,.6);
  --blue-d: rgba(10,30,255,.15);
  --red:    #FF1E1E;
  --red-g:  rgba(255,30,30,.6);
  --red-d:  rgba(255,30,30,.1);
  --white:  #FFFFFF;
  --carbon: #06060A;
  --c2:     #0E0E14;
  --grey:   #4A5868;
  --grey-l: #8A9AAA;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1920px; height:1080px; overflow:hidden;
  background:var(--carbon);
  font-family:'Barlow Condensed',sans-serif; color:var(--white);
}

/* Fond carbone */
.bg-carbon {
  position:absolute; inset:0;
  background:
    repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,.012) 2px, rgba(255,255,255,.012) 4px),
    repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(255,255,255,.012) 2px, rgba(255,255,255,.012) 4px),
    var(--carbon);
}
.halo-blue { position:absolute; top:-200px; left:-200px; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, var(--blue-d), transparent 70%); animation:halopulse 4s ease-in-out infinite; }
.halo-red  { position:absolute; bottom:-200px; right:-200px; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, var(--red-d), transparent 70%); animation:halopulse 4s ease-in-out infinite reverse; }
@keyframes halopulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.15);opacity:1} }

/* Lignes de vitesse */
.speedlines { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.sl { position:absolute; top:0; bottom:0; width:1px; background:linear-gradient(180deg, transparent, rgba(255,255,255,.04), transparent); animation:slmove 2s linear infinite; }
@keyframes slmove { from{transform:translateX(-100vw)} to{transform:translateX(200vw)} }

/* Bandes top/bottom */
.stripe-top {
  position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--blue), var(--red));
  box-shadow:0 0 16px var(--blue-g);
  animation:stripeflash 2s ease-in-out infinite;
}
@keyframes stripeflash { 0%,100%{opacity:1} 50%{opacity:.7} }
.stripe-bottom { position:absolute; bottom:0; left:0; right:0; height:5px; background:linear-gradient(90deg, var(--blue), var(--red)); }

/* Numéro géant fond */
.bg-num {
  position:absolute; bottom:-80px; right:60px;
  font-family:'Orbitron',sans-serif; font-size:540px; font-weight:900; line-height:1;
  color:transparent; -webkit-text-stroke:2px rgba(10,30,255,.1);
  user-select:none; pointer-events:none; letter-spacing:-30px;
}

/* Coins décoratifs */
.deco { position:absolute; z-index:8; }
.deco-tl { top:18px; left:18px;   width:80px; height:80px; border-top:3px solid var(--blue); border-left:3px solid var(--blue);  }
.deco-tr { top:18px; right:18px;  width:80px; height:80px; border-top:3px solid var(--red);  border-right:3px solid var(--red);   }
.deco-bl { bottom:18px; left:18px;  width:80px; height:80px; border-bottom:3px solid var(--blue); border-left:3px solid var(--blue);  }
.deco-br { bottom:18px; right:18px; width:80px; height:80px; border-bottom:3px solid var(--red);  border-right:3px solid var(--red);  }

/* Badge N° */
.num-badge {
  position:absolute; top:24px; left:24px; z-index:10;
  font-family:'Orbitron',sans-serif; font-size:28px; font-weight:900;
  color:var(--blue); text-shadow:0 0 20px var(--blue-g);
  background:var(--blue-d); border:1px solid rgba(10,30,255,.3);
  padding:6px 16px;
  animation:fadeUp .8s .1s ease-out both;
}

/* Contenu central */
.center {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:5;
}
.team-label  { font-size:16px; font-weight:700; letter-spacing:18px; color:var(--grey-l); text-transform:uppercase; margin-bottom:8px; animation:fadeUp .8s ease-out both; }
.main-name {
  font-family:'Orbitron',sans-serif; font-size:130px; font-weight:900; line-height:.9; letter-spacing:-4px;
  background:linear-gradient(135deg, var(--white) 0%, var(--grey-l) 40%, var(--white) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:fadeUp .8s .15s ease-out both;
}
.main-sub {
  font-family:'Orbitron',sans-serif; font-size:38px; font-weight:700; letter-spacing:14px;
  color:var(--blue); text-shadow:0 0 30px var(--blue-g); margin-top:4px;
  animation:fadeUp .8s .3s ease-out both;
}
.divider {
  width:560px; height:2px; margin:28px auto;
  background:linear-gradient(90deg, transparent, var(--blue), var(--red), transparent);
  box-shadow:0 0 8px var(--blue-g);
  animation:expandW .8s .45s ease-out both;
}
@keyframes expandW { from{transform:scaleX(0)} to{transform:scaleX(1)} }
.starting-label { font-size:26px; font-weight:700; letter-spacing:14px; color:var(--grey-l); text-transform:uppercase; animation:fadeUp .8s .55s ease-out both; }
.countdown { font-family:'Orbitron',sans-serif; font-size:80px; font-weight:900; letter-spacing:4px; margin-top:16px; animation:fadeUp .8s .65s ease-out both; }
.cd-time  { color:var(--white); text-shadow:0 0 30px rgba(255,255,255,.4); }
.cd-label { font-size:22px; font-weight:700; letter-spacing:8px; color:var(--grey-l); display:block; text-align:center; margin-top:-8px; }

@keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

/* Footer socials */
.footer {
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  display:flex; gap:40px; z-index:10;
  animation:fadeUp .8s .8s ease-out both;
}
.foot-item { display:flex; align-items:center; gap:10px; }
.foot-icon {
  width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
}
.foot-handle { font-size:24px; font-weight:700; letter-spacing:1px; color:var(--grey-l); }
</style>
</head>
<body>

<div class="bg-carbon"></div>
<div class="halo-blue"></div>
<div class="halo-red"></div>

<div class="speedlines">
  <div class="sl" style="left:15%;animation-delay:0s;animation-duration:1.8s"></div>
  <div class="sl" style="left:28%;animation-delay:.4s;animation-duration:2.2s"></div>
  <div class="sl" style="left:42%;animation-delay:.7s;animation-duration:1.5s"></div>
  <div class="sl" style="left:57%;animation-delay:1.1s;animation-duration:2.4s"></div>
  <div class="sl" style="left:71%;animation-delay:.3s;animation-duration:1.9s"></div>
  <div class="sl" style="left:85%;animation-delay:.8s;animation-duration:2.1s"></div>
</div>

<div class="stripe-top"></div>
<div class="stripe-bottom"></div>
<div class="bg-num">01</div>

<div class="deco deco-tl"></div>
<div class="deco deco-tr"></div>
<div class="deco deco-bl"></div>
<div class="deco deco-br"></div>
<div class="num-badge">— N° 01 —</div>

<div class="center">
  <div class="team-label">Matt Racing Team · Sim Racing · FR</div>
  <div class="main-name">MATT</div>
  <div class="main-sub">RACING LIVE</div>
  <div class="divider"></div>
  <div class="starting-label">Démarrage imminent</div>
  <div class="countdown">
    <span class="cd-time" id="timer">00:00</span>
    <span class="cd-label">Préparez-vous !</span>
  </div>
</div>

<div class="footer">
  <div class="foot-item">
    <div class="foot-icon">T</div>
    <span class="foot-handle">twitch.tv/mattracinglive</span>
  </div>
  <div class="foot-item">
    <div class="foot-icon">▶</div>
    <span class="foot-handle">@MattRacingLive</span>
  </div>
  <div class="foot-item">
    <div class="foot-icon">ig</div>
    <span class="foot-handle">mattracinglive</span>
  </div>
</div>

<script>
function updateTimer() {
  const now = new Date();
  const target = new Date(now);
  target.setMinutes(55, 0, 0);
  if (target <= now) target.setHours(target.getHours() + 1);
  const diff = Math.max(0, Math.floor((target - now) / 1000));
  const m = String(Math.floor(diff / 60)).padStart(2,'0');
  const s = String(diff % 60).padStart(2,'0');
  document.getElementById('timer').textContent = m + ':' + s;
}
updateTimer();
setInterval(updateTimer, 1000);
</script>
</body>
</html>
