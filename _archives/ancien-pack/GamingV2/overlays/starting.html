<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Starting V2</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #080312;
    --primary: #c47bff;
    --text:    #f0e8ff;
    --text-dim:#c4a8f0;
    --border:  rgba(196,123,255,.28);
    --glow-sm: 0 0 6px rgba(196,123,255,.40);
    --glow-md: 0 0 10px rgba(196,123,255,.30), 0 0 22px rgba(196,123,255,.10);
    --glow-lg: 0 0 18px rgba(196,123,255,.35), 0 0 50px rgba(196,123,255,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; font-family: 'Rajdhani', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(196,123,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(196,123,255,.045) 1px, transparent 1px); background-size: 90px 90px; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at center, transparent 30%, rgba(8,3,18,.95) 100%); }
  .ambient { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at center, rgba(196,123,255,.05) 0%, transparent 70%); }
  .scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.07) 3px, rgba(0,0,0,.07) 4px); pointer-events: none; z-index: 5; }

  .line { position: absolute; left: 0; right: 0; height: 1px; z-index: 4; }
  .line-top    { top: 0;    background: linear-gradient(90deg, transparent, var(--primary) 30%, var(--primary) 70%, transparent); box-shadow: var(--glow-sm); }
  .line-bottom { bottom: 0; background: linear-gradient(90deg, transparent, var(--primary) 30%, var(--primary) 70%, transparent); box-shadow: var(--glow-sm); }

  .corner { position: absolute; width: 90px; height: 90px; z-index: 10; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--primary); box-shadow: var(--glow-sm); }
  .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
  .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
  .corner.tl { top: 30px; left: 30px; }
  .corner.tr { top: 30px; right: 30px; transform: scaleX(-1); }
  .corner.bl { bottom: 30px; left: 30px; transform: scaleY(-1); }
  .corner.br { bottom: 30px; right: 30px; transform: scale(-1); }

  .center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%); text-align: center; z-index: 15; }

  .pre-label { font-size: 22px; font-weight: 500; letter-spacing: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 28px; animation: fadeUp .8s ease both; }

  .title-wrap { position: relative; display: inline-block; }
  .title { font-family: 'Exo 2', sans-serif; font-size: 110px; font-weight: 900; letter-spacing: 16px; text-transform: uppercase; color: var(--text); text-shadow: var(--glow-lg); animation: fadeUp .8s ease .2s both, glitch 5s infinite 2s; position: relative; z-index: 1; }
  .title-glitch { position: absolute; inset: 0; font-family: 'Exo 2', sans-serif; font-size: 110px; font-weight: 900; letter-spacing: 16px; text-transform: uppercase; color: var(--primary); animation: glitch-layer 5s infinite 2s; clip-path: polygon(0 25%, 100% 25%, 100% 45%, 0 45%); opacity: 0; }

  @keyframes glitch { 0%, 88%, 100% { transform: none; } 90% { transform: translate(-3px, 0); } 92% { transform: translate(3px, 0); } 94% { transform: none; } }
  @keyframes glitch-layer { 0%, 88%, 100% { opacity: 0; transform: none; } 90% { opacity: .6; transform: translate(6px, 0); } 92% { opacity: .6; transform: translate(-3px, 0); } 94% { opacity: 0; transform: none; } }

  .subtitle { font-size: 22px; font-weight: 500; letter-spacing: 8px; text-transform: uppercase; color: var(--text-dim); margin-top: 22px; animation: fadeUp .8s ease .4s both; }

  .progress-wrap { margin-top: 70px; width: 600px; animation: fadeUp .8s ease .6s both; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 22px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: rgba(196,123,255,.40); margin-bottom: 10px; }
  .progress-track { height: 3px; background: rgba(196,123,255,.08); border: 1px solid var(--border); overflow: hidden; position: relative; }
  .progress-fill { position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--primary), transparent); box-shadow: var(--glow-sm); animation: scan 2.2s linear infinite; }
  @keyframes scan { to { left: 100%; } }

  .status-bar { position: absolute; bottom: 50px; left: 0; right: 0; display: flex; justify-content: center; gap: 70px; font-size: 22px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; color: rgba(196,123,255,.40); z-index: 15; }
  .status-bar span { display: flex; align-items: center; gap: 8px; }
  .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: var(--glow-sm); animation: blink 2s ease infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="grid"></div>
<div class="vignette"></div>
<div class="ambient"></div>
<div class="scanlines"></div>
<div class="line line-top"></div>
<div class="line line-bottom"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="center">
  <div class="pre-label">// Initialisation du stream //</div>
  <div class="title-wrap">
    <div class="title">PRÉPARATION</div>
    <div class="title-glitch">PRÉPARATION</div>
  </div>
  <div class="subtitle">Le stream démarre bientôt</div>
  <div class="progress-wrap">
    <div class="progress-meta"><span>Chargement...</span><span>Système OK</span></div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>
</div>
<div class="status-bar">
  <span><div class="s-dot"></div>Stream Online</span>
  <span><div class="s-dot"></div>Connexion Stable</span>
  <span><div class="s-dot"></div>Cam Active</span>
</div>
</body>
</html>
