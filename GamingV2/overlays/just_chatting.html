<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Just Chatting V2</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --surface:   rgba(8,3,22,.93);
    --primary:   #c47bff;
    --text:      #f0e8ff;
    --text-dim:  #c4a8f0;
    --red:       #ff3d78;
    --border:    rgba(196,123,255,.30);
    --border-hi: rgba(196,123,255,.65);
    --glow-sm:   0 0 6px rgba(196,123,255,.40);
    --glow-md:   0 0 10px rgba(196,123,255,.28), 0 0 20px rgba(196,123,255,.10);
    --glow-red:  0 0 6px rgba(255,61,120,.50);
    --yt:  #ff4040; --tw: #c47bff; --ttg: #ff6eb4; --ttd: #00ccff; --ig: #e1306c;
    --cam-w:  594px;
    --cam-h:  380px;
    --bar-h:   64px;
    --chat-w: 500px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin  { to { --a: 360deg; } }
  @keyframes blink { 50% { opacity: 0; } }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px);
    pointer-events: none; z-index: 10;
  }

  /* ══ WEBCAM ══ */
  .webcam-zone { position: absolute; left: 20px; bottom: 20px; width: var(--cam-w); display: flex; flex-direction: column; }

  .cam-top {
    height: var(--bar-h); background: var(--surface);
    border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; position: relative; overflow: hidden;
  }
  .cam-top::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom, var(--primary), transparent); box-shadow: var(--glow-sm); }
  .cam-top::after  { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(196,123,255,.06) 0%, transparent 60%); pointer-events: none; }

  .cam-name { font-family: 'Exo 2', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--text); text-shadow: var(--glow-sm); position: relative; z-index: 1; }
  .cam-name .accent { color: var(--primary); }

  .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,61,120,.12); border: 1px solid rgba(255,61,120,.35); padding: 3px 10px; clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%); position: relative; z-index: 1; }
  .dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; box-shadow: var(--glow-red); animation: blink 1.2s step-end infinite; }
  .live-text { font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--red); text-shadow: var(--glow-red); }

  .cam-frame { position: relative; width: var(--cam-w); height: var(--cam-h); }
  .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(196,123,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(196,123,255,.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .inner-glow { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(196,123,255,.05) 0%, transparent 70%); pointer-events: none; }
  .border-spin { position: absolute; inset: 0; border: 2px solid transparent; background: linear-gradient(transparent, transparent) padding-box, conic-gradient(from var(--a), transparent 30%, var(--primary) 50%, transparent 70%) border-box; animation: spin 5s linear infinite; }
  .border-base { position: absolute; inset: 0; border: 1px solid var(--border); border-top: none; border-bottom: none; }
  .corner { position: absolute; width: 20px; height: 20px; z-index: 5; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--primary); box-shadow: var(--glow-md); }
  .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
  .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
  .corner.tl { top: 8px; left: 8px; }
  .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 8px; right: 8px; transform: scale(-1); }

  .cam-bottom {
    height: var(--bar-h); background: var(--surface);
    border: 1px solid var(--border); border-top: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; position: relative; overflow: hidden;
  }
  .cam-bottom::after  { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(to top, var(--primary), transparent); box-shadow: var(--glow-sm); }
  .cam-bottom::before { content: ''; position: absolute; inset: 0; background: linear-gradient(270deg, rgba(196,123,255,.06) 0%, transparent 60%); pointer-events: none; }
  .cam-status { font-size: 22px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); position: relative; z-index: 1; }
  .cam-badge  { background: rgba(196,123,255,.10); border: 1px solid var(--border-hi); padding: 3px 14px; clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%); position: relative; z-index: 1; }
  .cam-badge span { font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--primary); text-shadow: var(--glow-sm); }

  /* ══ BARRE PLATEFORMES ══ */
  .platforms-bar {
    position: absolute;
    left: 20px; right: calc(var(--chat-w) + 30px);
    bottom: calc(var(--cam-h) + var(--bar-h) * 2 + 30px);
    height: 80px;
    display: flex; gap: 8px;
  }
  .plat {
    flex: 1; height: 100%;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    position: relative; overflow: hidden;
  }
  .plat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .plat.yt ::before { background: var(--yt);  box-shadow: 0 0 8px var(--yt); }
  .plat.tw ::before { background: var(--tw);  box-shadow: 0 0 8px var(--tw); }
  .plat.ttg::before { background: var(--ttg); box-shadow: 0 0 8px var(--ttg); }
  .plat.ttd::before { background: var(--ttd); box-shadow: 0 0 8px var(--ttd); }
  .plat.ig ::before { background: var(--ig);  box-shadow: 0 0 8px var(--ig); }

  .plat-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .plat.yt  .plat-icon { color: var(--yt);  filter: drop-shadow(0 0 4px var(--yt)); }
  .plat.tw  .plat-icon { color: var(--tw);  filter: drop-shadow(0 0 4px var(--tw)); }
  .plat.ttg .plat-icon { color: var(--ttg); filter: drop-shadow(0 0 4px var(--ttg)); }
  .plat.ttd .plat-icon { color: var(--ttd); filter: drop-shadow(0 0 4px var(--ttd)); }
  .plat.ig  .plat-icon { color: var(--ig);  filter: drop-shadow(0 0 4px var(--ig)); }

  .plat-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .plat-name { font-family: 'Exo 2', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
  .plat.yt  .plat-name { color: var(--yt);  text-shadow: 0 0 6px var(--yt); }
  .plat.tw  .plat-name { color: var(--tw);  text-shadow: 0 0 6px var(--tw); }
  .plat.ttg .plat-name { color: var(--ttg); text-shadow: 0 0 6px var(--ttg); }
  .plat.ttd .plat-name { color: var(--ttd); text-shadow: 0 0 6px var(--ttd); }
  .plat.ig  .plat-name { color: var(--ig);  text-shadow: 0 0 6px var(--ig); }

  .plat-handle { font-size: 22px; font-weight: 500; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .plat-dot { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; animation: blink2 1.8s ease infinite; }
  .plat.yt  .plat-dot { background: var(--yt);  box-shadow: 0 0 6px var(--yt); }
  .plat.tw  .plat-dot { background: var(--tw);  box-shadow: 0 0 6px var(--tw); }
  .plat.ttg .plat-dot { background: var(--ttg); box-shadow: 0 0 6px var(--ttg); }
  .plat.ttd .plat-dot { background: var(--ttd); box-shadow: 0 0 6px var(--ttd); }
  .plat.ig  .plat-dot { background: var(--ig);  box-shadow: 0 0 6px var(--ig); }
  @keyframes blink2 { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }

  /* ══ ZONE CHAT ══ */
  .chat-zone { position: absolute; right: 20px; top: 20px; bottom: 20px; width: var(--chat-w); background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { height: var(--bar-h); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); position: relative; }
  .chat-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); box-shadow: var(--glow-sm); }
  .chat-title { font-family: 'Exo 2', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--text); text-shadow: var(--glow-sm); }
  .chat-sub   { font-size: 22px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
  .chat-body  { flex: 1; position: relative; overflow: hidden; }
  .chat-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(196,123,255,.18); font-size: 22px; letter-spacing: 2px; text-align: center; text-transform: uppercase; }
</style>
</head>
<body>

<!-- Webcam -->
<div class="webcam-zone">
  <div class="cam-top">
    <div class="cam-name"><span class="accent">L</span>ATSHOW</div>
    <div class="live-badge"><div class="dot"></div><span class="live-text">Live</span></div>
  </div>
  <div class="cam-frame">
    <div class="grid-bg"></div>
    <div class="inner-glow"></div>
    <div class="border-spin"></div>
    <div class="border-base"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanlines"></div>
  </div>
  <div class="cam-bottom">
    <div class="cam-status">CAM_01 :: Online</div>
    <div class="cam-badge"><span>En Direct</span></div>
  </div>
</div>

<!-- Barre plateformes (5 colonnes) -->

      <div class="plat-name">YouTube</div>
      <div class="plat-handle">@Latshow-y</div>
    </div>
    <div class="plat-dot"></div>
  </div>

  <div class="plat tw">
    <svg class="plat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.6 5.9h1.6v4.6h-1.6zm4.3 0H17v4.6h-1.6zM2.4 0 0 3.4v17.2h5.8V24l3.4-3.4h4.3L21.6 12V0zm17.6 11.1-3.4 3.4H12l-3 3v-3H4.8V1.6h15.2z"/></svg>
    <div class="plat-info">
      <div class="plat-name">Twitch</div>
      <div class="plat-handle">latshow_</div>
    </div>
    <div class="plat-dot"></div>
  </div>

  <div class="plat ttg">
    <svg class="plat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 3.3A4.9 4.9 0 0 1 15.2 0h-3.4v16.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .5 0 .8.1V10a6.3 6.3 0 0 0-.8-.1A6.3 6.3 0 0 0 2.6 16.3a6.3 6.3 0 0 0 9.2 5.6V24h3.4v-9.1a8.3 8.3 0 0 0 4.4 1.3V12.8a4.9 4.9 0 0 1-4.4-4.9V7a8.3 8.3 0 0 0 4.4 1.3V4.9a4.9 4.9 0 0 1-.1-.4z"/></svg>
    <div class="plat-info">
      <div class="plat-name">TikTok</div>
      <div class="plat-handle">@latshow_</div>
    </div>
    <div class="plat-dot"></div>
  </div>

  <div class="plat ttd">
    <svg class="plat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 3.3A4.9 4.9 0 0 1 15.2 0h-3.4v16.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .5 0 .8.1V10a6.3 6.3 0 0 0-.8-.1A6.3 6.3 0 0 0 2.6 16.3a6.3 6.3 0 0 0 9.2 5.6V24h3.4v-9.1a8.3 8.3 0 0 0 4.4 1.3V12.8a4.9 4.9 0 0 1-4.4-4.9V7a8.3 8.3 0 0 0 4.4 1.3V4.9a4.9 4.9 0 0 1-.1-.4z"/></svg>
    <div class="plat-info">
      <div class="plat-name">TikTok DEV</div>
      <div class="plat-handle">@linedev_</div>
    </div>
    <div class="plat-dot"></div>
  </div>

  <div class="plat ig">
    <svg class="plat-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>

      <div class="plat-name">Instagram</div>
      <div class="plat-handle">latshow.y</div>
    </div>
    <div class="plat-dot"></div>
  </div>

</div>

<!-- Chat -->
<div class="chat-zone">
  <div class="chat-header">
    <div class="chat-title">Chat</div>
    <div class="chat-sub">Multi-plateforme</div>
  </div>
  <div class="chat-body">
    <div class="chat-placeholder">
      <span>[ Zone Chat ]</span>
      <span>Source navigateur OBS<br>ou capture fenêtre</span>
    </div>
  </div>
</div>

</body>
</html>
