<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Platforms Bar V2</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: rgba(8,3,22,.93);
    --primary: #c47bff;
    --text:    #f0e8ff;
    --text-dim:#c4a8f0;
    --border:  rgba(196,123,255,.28);
    --glow-sm: 0 0 6px rgba(196,123,255,.40);
    --yt:#ff4040; --tw:#c47bff; --ttg:#ff6eb4; --ttd:#00ccff; --ig:#e1306c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1400px; height:90px;
    background:transparent; overflow:hidden;
    font-family:'Rajdhani',sans-serif; -webkit-font-smoothing:antialiased;
  }
  .bar {
    display:flex; align-items:stretch; height:100%;
    background:var(--surface); border:1px solid var(--border);
    position:relative; overflow:hidden;
  }
  .bar::before {
    content:''; position:absolute; top:0; left:-100%; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--primary),transparent);
    box-shadow:var(--glow-sm); animation:slide 3.5s linear infinite;
  }
  @keyframes slide { to { left:100%; } }

  .module {
    flex:1; display:flex; align-items:center;
    padding:0 20px; gap:14px; position:relative;
  }
  .module:not(:last-child)::after {
    content:''; position:absolute; right:0; top:16%; bottom:16%;
    width:1px; background:var(--border);
  }
  .module::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  }
  .module.yt ::before { background:var(--yt);  box-shadow:0 0 6px rgba(255,64,64,.45); }
  .module.tw ::before { background:var(--tw);  box-shadow:0 0 6px rgba(196,123,255,.40); }
  .module.ttg::before { background:var(--ttg); box-shadow:0 0 6px rgba(255,110,180,.45); }
  .module.ttd::before { background:var(--ttd); box-shadow:0 0 6px rgba(0,204,255,.45); }
  .module.ig ::before { background:var(--ig);  box-shadow:0 0 6px rgba(225,48,108,.45); }

  .icon { width:28px; height:28px; flex-shrink:0; }
  .module.yt  .icon { color:var(--yt); }
  .module.tw  .icon { color:var(--tw); }
  .module.ttg .icon { color:var(--ttg); }
  .module.ttd .icon { color:var(--ttd); }
  .module.ig  .icon { color:var(--ig); }

  .info { display:flex; flex-direction:column; gap:2px; min-width:0; }

  .p-name {
    font-family:'Exo 2',sans-serif;
    font-size:22px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    white-space:nowrap; line-height:1.1;
  }
  .module.yt  .p-name { color:var(--yt); }
  .module.tw  .p-name { color:var(--tw); }
  .module.ttg .p-name { color:var(--ttg); }
  .module.ttd .p-name { color:var(--ttd); }
  .module.ig  .p-name { color:var(--ig); }

  .p-handle {
    font-size:22px; font-weight:500; letter-spacing:1px;
    color:var(--text-dim); white-space:nowrap;
  }

  .live-dot {
    margin-left:auto; width:8px; height:8px; border-radius:50%; flex-shrink:0;
    animation:blink 1.8s ease infinite;
  }
  .module.yt  .live-dot { background:var(--yt); }
  .module.tw  .live-dot { background:var(--tw); }
  .module.ttg .live-dot { background:var(--ttg); }
  .module.ttd .live-dot { background:var(--ttd); }
  .module.ig  .live-dot { background:var(--ig); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  .scanlines {
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="bar">

    <div class="info"><div class="p-name">YouTube</div><div class="p-handle">@Latshow-y</div></div>

    <div class="info"><div class="p-name">TikTok DEV</div><div class="p-handle">@linedev_</div></div>
    <div class="live-dot"></div>
  </div>

    <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
    <div class="info"><div class="p-name">Instagram</div><div class="p-handle">latshow.y</div></div>
    <div class="live-dot"></div>
  </div>
  <div class="scanlines"></div>
</div>
</body>
</html>
