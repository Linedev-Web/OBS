<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pause Enfants V2</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080312;
    --primary:   #c47bff;
    --primary-hi:#dba8ff;
    --text:      #f0e8ff;
    --text-dim:  #c4a8f0;
    --pink:      #ff6eb4;
    --gold:      #ffd166;
    --border:    rgba(196,123,255,.30);
    --border-hi: rgba(196,123,255,.65);
    --glow-sm:   0 0 6px rgba(196,123,255,.40);
    --glow-md:   0 0 10px rgba(196,123,255,.28), 0 0 22px rgba(196,123,255,.10);
    --glow-lg:   0 0 18px rgba(196,123,255,.35), 0 0 50px rgba(196,123,255,.10);
    --glow-pink: 0 0 10px rgba(255,110,180,.55), 0 0 28px rgba(255,110,180,.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Fond grille */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(196,123,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,123,255,.055) 1px, transparent 1px);
    background-size: 90px 90px;
  }
  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 70% at center, transparent 30%, rgba(8,3,18,.96) 100%);
  }
  /* Lueur ambiante rose-violet pour le côté chaleureux */
  .ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 40% at center, rgba(196,123,255,.06) 0%, transparent 70%),
      radial-gradient(ellipse 30% 25% at center, rgba(255,110,180,.04) 0%, transparent 60%);
  }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px, rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px
    );
    pointer-events: none; z-index: 5;
  }

  /* Lignes bord */
  .line { position: absolute; left: 0; right: 0; height: 1px; z-index: 4; }
  .line-top    { top: 0;    background: linear-gradient(90deg, transparent, var(--primary) 30%, var(--primary) 70%, transparent); box-shadow: var(--glow-sm); }
  .line-bottom { bottom: 0; background: linear-gradient(90deg, transparent, var(--primary) 30%, var(--primary) 70%, transparent); box-shadow: var(--glow-sm); }

  /* Coins */
  .corner { position: absolute; width: 90px; height: 90px; z-index: 10; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--primary); box-shadow: var(--glow-md); }
  .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
  .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
  .corner.tl { top: 30px; left: 30px; }
  .corner.tr { top: 30px; right: 30px; transform: scaleX(-1); }
  .corner.bl { bottom: 30px; left: 30px; transform: scaleY(-1); }
  .corner.br { bottom: 30px; right: 30px; transform: scale(-1); }

  /* ── Contenu central ── */
  .center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    text-align: center; z-index: 15;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }

  /* Étiquette top */
  .pre-label {
    font-size: 22px; font-weight: 500; letter-spacing: 10px;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 32px;
    animation: fadeUp .8s ease both;
  }

  /* ── Coeur CSS ── */
  .heart-wrap {
    margin-bottom: 36px;
    animation: fadeUp .8s ease .1s both;
  }
  .heart {
    position: relative;
    width: 80px; height: 72px;
    animation: heartbeat 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(255,110,180,.8)) drop-shadow(0 0 36px rgba(255,110,180,.4));
  }
  .heart::before, .heart::after {
    content: '';
    position: absolute;
    width: 40px; height: 64px;
    background: var(--pink);
    border-radius: 40px 40px 0 0;
  }
  .heart::before { left: 40px; transform-origin: 0 100%; transform: rotate(-45deg); }
  .heart::after  { left: 0;    transform-origin: 100% 100%; transform: rotate(45deg); }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%       { transform: scale(1.2); }
    28%       { transform: scale(1); }
    42%       { transform: scale(1.15); }
    56%       { transform: scale(1); }
  }

  /* Titre principal */
  .title {
    font-family: 'Exo 2', sans-serif;
    font-size: 108px; font-weight: 900;
    letter-spacing: 14px; text-transform: uppercase;
    color: var(--text); text-shadow: var(--glow-lg);
    animation: fadeUp .8s ease .2s both;
  }

  /* Ligne accent sous le titre */
  .title-line {
    width: 400px; height: 2px; margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    box-shadow: var(--glow-pink);
    animation: fadeUp .8s ease .3s both;
  }

  /* Message principal */
  .message {
    font-family: 'Exo 2', sans-serif;
    font-size: 36px; font-weight: 900;
    letter-spacing: 6px; text-transform: uppercase;
    color: var(--pink);
    text-shadow: var(--glow-pink);
    margin-top: 28px;
    animation: fadeUp .8s ease .4s both;
  }

  .sub-message {
    font-size: 22px; font-weight: 500;
    letter-spacing: 6px; text-transform: uppercase;
    color: var(--text-dim); margin-top: 12px;
    animation: fadeUp .8s ease .5s both;
  }

  /* Horloge */
  .clock {
    font-family: 'Exo 2', sans-serif;
    font-size: 42px; font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255,209,102,.70);
    margin-top: 50px;
    animation: fadeUp .8s ease .6s both;
  }

  /* Petits coeurs flottants */
  .floating-hearts { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
  .fh {
    position: absolute;
    font-size: 0;
    width: 10px; height: 9px;
    opacity: 0;
    animation: float linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,110,180,.8));
  }
  .fh::before, .fh::after {
    content: '';
    position: absolute;
    width: 5px; height: 8px;
    background: var(--pink);
    border-radius: 5px 5px 0 0;
  }
  .fh::before { left: 5px; transform-origin: 0 100%; transform: rotate(-45deg); }
  .fh::after  { left: 0;   transform-origin: 100% 100%; transform: rotate(45deg); }

  @keyframes float {
    0%   { transform: translateY(0)   rotate(0deg);   opacity: 0; }
    10%  { opacity: .6; }
    90%  { opacity: .4; }
    100% { transform: translateY(-320px) rotate(20deg); opacity: 0; }
  }

  /* Barre status */
  .status-bar {
    position: absolute; bottom: 50px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 70px;
    font-size: 22px; font-weight: 500; letter-spacing: 4px;
    text-transform: uppercase; color: rgba(196,123,255,.35); z-index: 15;
  }
  .status-bar span { display: flex; align-items: center; gap: 8px; }
  .s-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--pink); box-shadow: 0 0 8px var(--pink);
    animation: blink 2s ease infinite;
  }
  @keyframes blink   { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  @keyframes fadeUp  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="grid"></div>
<div class="vignette"></div>
<div class="ambient"></div>
<div class="scanlines"></div>
<div class="line line-top"></div>
<div class="line line-bottom"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- Petits coeurs flottants -->
<div class="floating-hearts" id="hearts"></div>

<div class="center">
  <div class="pre-label">// pause forcée //</div>
  <div class="heart-wrap"><div class="heart"></div></div>
  <div class="title">PAUSE</div>
  <div class="title-line"></div>
  <div class="message">Les enfants m'appellent ♥</div>
  <div class="sub-message">Je reviens très vite !</div>
  <div class="clock" id="clock">00:00:00</div>
</div>

<div class="status-bar">
  <span><div class="s-dot"></div>Stream actif</span>
  <span><div class="s-dot"></div>Papa / Maman mode</span>
  <span><div class="s-dot"></div>BRB</span>
</div>

<script>
  /* Horloge */
  let seconds = 0;
  const pad = n => String(n).padStart(2, '0');
  setInterval(() => {
    seconds++;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    document.getElementById('clock').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
  }, 1000);

  /* Petits coeurs flottants aléatoires */
  const container = document.getElementById('hearts');
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'fh';
    const x    = 10 + Math.random() * 80;
    const dur  = 5 + Math.random() * 8;
    const del  = Math.random() * 8;
    const size = 8 + Math.random() * 10;
    el.style.cssText = `
      left: ${x}%;
      bottom: ${8 + Math.random() * 20}%;
      width: ${size}px; height: ${size * .9}px;
      animation-duration: ${dur}s;
      animation-delay: ${del}s;
    `;
    el.style.setProperty('--s', size + 'px');
    /* Ajustement des pseudo-éléments via inline n'est pas possible,
       donc on leur applique une transform globale via scale */
    el.style.transform = `scale(${size / 10})`;
    container.appendChild(el);
  }
</script>
</body>
</html>
