<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Webcam V2</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Exo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #c47bff;
    --text-dim:  #c4a8f0;
    --red:       #ff3d78;
    --border:    rgba(196,123,255,.28);
    --glow-sm:   0 0 6px rgba(196,123,255,.40);
    --glow-md:   0 0 10px rgba(196,123,255,.28), 0 0 20px rgba(196,123,255,.10);
    --glow-red:  0 0 6px rgba(255,61,120,.50);
    --frame-w: 594px;
    --frame-h: 380px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: var(--frame-w); height: var(--frame-h);
    background: transparent; overflow: hidden;
    font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .frame { position: relative; width: 100%; height: 100%; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(196,123,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,123,255,.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  .inner-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(196,123,255,.03) 0%, transparent 70%); pointer-events: none;
  }
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --a: 360deg; } }
  .border-spin {
    position: absolute; inset: 0;
    border: 2px solid transparent;
    background: linear-gradient(transparent, transparent) padding-box,
      conic-gradient(from var(--a), transparent 30%, var(--primary) 50%, transparent 70%) border-box;
    animation: spin 5s linear infinite; opacity: .7;
  }
  .border-base { position: absolute; inset: 0; border: 1px solid var(--border); }
  .corner { position: absolute; width: 22px; height: 22px; z-index: 5; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--primary); box-shadow: var(--glow-sm); }
  .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
  .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }
  .corner.tl { top: 8px; left: 8px; }
  .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 8px; right: 8px; transform: scale(-1); }
  .status {
    position: absolute; top: 14px; right: 34px;
    display: flex; align-items: center; gap: 7px;
    font-size: 22px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); z-index: 6;
  }
  .dot {
    width: 7px; height: 7px; background: var(--red); border-radius: 50%;
    box-shadow: var(--glow-red); animation: blink 1.2s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .sys-tag {
    position: absolute; bottom: 14px; left: 34px;
    font-size: 22px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(196,123,255,.30); z-index: 6;
  }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.05) 3px, rgba(0,0,0,.05) 4px);
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="grid"></div>
  <div class="inner-glow"></div>
  <div class="border-spin"></div>
  <div class="border-base"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="status"><div class="dot"></div>LIVE</div>
  <div class="sys-tag">CAM_01</div>
  <div class="scanlines"></div>
</div>
</body>
</html>
