<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Démarrage</title>
<link rel="stylesheet" href="latshow.css"><script src="../fonds.js"></script><script src="../commun/scene.js"></script><script src="../commun/papa.js"></script></head><body><div id="scene">
<!-- Habillage « papa » (2026-11-08) : photo tirée au hasard, compte à rebours et moustache qui se remplit. Le chat est posé
     par OBS dans sa zone (chat.attente 1416,120,440,840). Textes selon la séance : commun/papa.js. -->
<div class="fond"></div><div class="photo" data-photo="demarrage"></div><div class="voile"></div>
<div class="signe moustache"></div>
<div class="bloc">
  <div class="mot" data-texte="demarrage-mot"></div>
  <div class="titre" data-texte="demarrage-titre"></div>
  <div class="texte" data-si><span data-texte="ce-soir">Ce soir :</span> <b data-live="titre"></b></div>
  <div class="ligne-compte"><div class="compte" data-compte data-fini="J’arrive">05:00</div><div class="chrono"><div class="moustache"></div><div class="plein"><div class="moustache"></div></div></div></div>
  <div class="petit" data-texte="demarrage-petit" hidden></div>
  <div class="petit" data-coucher hidden>Jusqu’à <b data-coucher-heure></b><span data-texte="coucher-suite"> environ. Après, dodo.</span></div>
</div>
<div class="chat-titre" style="left:1416px;top:80px">Le chat</div>
<div class="chat-zone" style="left:1416px;top:120px;width:440px;height:840px"></div>
<div class="pied"><span><b>Latshow</b> sur Twitch et YouTube</span><span data-texte="pied"></span></div>
</div></body></html>
